name: ci

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - "schemas/**"
      - "docs/**"
      - "deploy/**"
      - ".dockerignore"
      - "deny.toml"
      - "mkdocs.yml"
      - "sdks/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-tag-release.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - "schemas/**"
      - "docs/**"
      - "deploy/**"
      - ".dockerignore"
      - "deny.toml"
      - "mkdocs.yml"
      - "sdks/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-tag-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core and protocol tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler postgresql-client

      - name: Verify PostgreSQL compatibility client
        run: psql --version

      - name: Check formatting for core packages
        run: >-
          cargo fmt
          --package ryme-sql
          --package ryme-wire-resp
          --package ryme-wire-pg
          --package ryme-raft
          -- --check

      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Audit dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Run the full locked workspace test matrix
        run: cargo test --workspace --all-targets --locked

  platform:
    name: Validate API docs, Pages, and SDK surface
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install page builder dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements-pages.txt

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint the Kubernetes chart
        run: helm lint deploy/k8s/helm/rymeDB

      - name: Validate OpenAPI
        run: python3 schemas/openapi/validate.py

      - name: Build Pages site
        run: mkdocs build --strict --site-dir _site

      - name: Add OpenAPI artifacts and repository images
        run: |
          mkdir -p _site/openapi
          cp schemas/openapi/rest.yaml _site/openapi/rest.yaml
          cp -R images _site/images
          mkdir -p _site/api
          cp docs/swagger-ui.html _site/api/index.html
          python3 -c 'import json, pathlib, yaml; source=pathlib.Path("schemas/openapi/rest.yaml"); target=pathlib.Path("_site/openapi/rest.json"); target.write_text(json.dumps(yaml.safe_load(source.read_text()), indent=2) + "\n")'

      - name: Verify supported SDK surface
        run: |
          actual="$(find sdks -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)"
          test "$actual" = "java,js,rust"
          test -f _site/index.html
          test -f _site/api/index.html
          grep -q 'SwaggerUIBundle' _site/api/index.html
          grep -q '../openapi/rest.yaml' _site/api/index.html
          test -f _site/openapi/rest.yaml
          test -f _site/openapi/rest.json
          test -f _site/sdk-java/index.html
          test -f _site/sdk-js/index.html
          test -f _site/sdk-rust/index.html
          test ! -e _site/requirements-pages/index.html
