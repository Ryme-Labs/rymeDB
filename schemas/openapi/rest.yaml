                backup_id:
                  type: string
      responses:
        '200':
          description: copied archive manifest
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/backups/verify:
    get:
      tags: [backups]
      description: Restore drill without disk writes. Verifies manifest sha256 plus envelope decryption per file.
      parameters:
        - name: backup_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: verified file count and commit
          content:
            application/json:
              schema:
                type: object
        '401':
