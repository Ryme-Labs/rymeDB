name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "static/**"
      - "schemas/openapi/validate.py"
      - "schemas/openapi/**"
      - "images/**"
      - "README.md"
      - "sdks/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "static/**"
      - "schemas/openapi/validate.py"
      - "schemas/openapi/**"
      - "images/**"
      - "README.md"
      - "sdks/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install API validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec
        run: python3 schemas/openapi/validate.py

      - name: Build static site
        run: pnpm run docs:build:ci

      - name: Add OpenAPI artifacts and repository images
        run: |
          mkdir -p _site/openapi
          cp schemas/openapi/rest.yaml _site/openapi/rest.yaml
          for asset in rymedb-banner.png rymedb-black.png rymedb-transparent.png rymedb-white.png; do
            test -s "_site/images/$asset"
          done
          grep -q 'images/rymedb-banner.png' _site/index.html
          grep -q 'images/rymedb-transparent.png' _site/index.html
          python3 -c 'import json, pathlib, yaml; source=pathlib.Path("schemas/openapi/rest.yaml"); target=pathlib.Path("_site/openapi/rest.json"); target.write_text(json.dumps(yaml.safe_load(source.read_text()), indent=2) + "\n")'

      - name: Verify generated site
        run: |
          test -f _site/index.html
          test -f _site/api/index.html
          grep -q 'plugin-@scalar/docusaurus' _site/api/index.html
          test -f _site/openapi/rest.yaml
          test -f _site/openapi/rest.json
          test -f _site/sdk-js/index.html
          test -f _site/sdk-rust/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
