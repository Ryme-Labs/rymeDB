name: docker

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ryme-labs/rymedb

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate database release version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/validate-release-version.mjs "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#rymedb-v}"
            release_major="${version%%.*}"
            release_minor="${version#*.}"
            release_minor="${release_minor%%.*}"
            echo "major=$release_major" >> "$GITHUB_OUTPUT"
            echo "major_minor=$release_major.$release_minor" >> "$GITHUB_OUTPUT"
          else
            version="$GITHUB_REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=rymedb-v${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=rymedb-v${{ steps.version.outputs.major_minor }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=rymedb-v${{ steps.version.outputs.major }},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=ryme-server
            org.opencontainers.image.description=rymeDB server (Postgres wire + RESP + REST operator API)
            org.opencontainers.image.source=https://github.com/Ryme-labs/rymedb

      - name: Build and push ryme-server
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          # PRs: build only, everything else: push
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign published image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE_NAME@$DIGEST"
