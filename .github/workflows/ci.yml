name: ci

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - "schemas/**"
      - "docs/**"
      - "deploy/**"
      - "scripts/**"
      - ".dockerignore"
      - "deny.toml"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "static/**"
      - "sdks/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/cli-release.yml"
      - ".github/workflows/server-release.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - "schemas/**"
      - "docs/**"
      - "deploy/**"
      - "scripts/**"
      - ".dockerignore"
      - "deny.toml"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "static/**"
      - "sdks/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/cli-release.yml"
      - ".github/workflows/server-release.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core and protocol tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler postgresql-client

      - name: Verify PostgreSQL compatibility client
        run: psql --version

      - name: Check formatting for core packages
        run: >-
          cargo fmt
          --package ryme-sql
          --package ryme-wire-resp
          --package ryme-wire-pg
          --package ryme-raft
          -- --check

      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Audit dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

      - name: Audit Rust SDK dependency advisories
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          command-arguments: advisories
          manifest-path: sdks/rust/Cargo.toml

      - name: Run the full locked workspace test matrix
        run: cargo test --workspace --all-targets --locked

  platform:
    name: Validate API docs, Pages, and SDK surface
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install API validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all pnpm dependencies
        run: pnpm audit

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.17.3

      - name: Lint the Kubernetes chart
        run: helm lint deploy/k8s/helm/rymeDB

      - name: Validate OpenAPI
        run: python3 schemas/openapi/validate.py

      - name: Build Pages site
        run: pnpm run docs:build:ci

      - name: Add OpenAPI artifacts and repository images
        run: |
          mkdir -p _site/openapi
          cp schemas/openapi/rest.yaml _site/openapi/rest.yaml
          python3 -c 'import json, pathlib, yaml; source=pathlib.Path("schemas/openapi/rest.yaml"); target=pathlib.Path("_site/openapi/rest.json"); target.write_text(json.dumps(yaml.safe_load(source.read_text()), indent=2) + "\n")'

      - name: Verify supported SDK surface
        run: |
          actual="$(find sdks -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)"
          test "$actual" = "js,rust"
          test -f _site/index.html
          test -f _site/api/index.html
          grep -q 'plugin-@scalar/docusaurus' _site/api/index.html
          test -f _site/openapi/rest.yaml
          test -f _site/openapi/rest.json
          test -f _site/sdk-js/index.html
          test -f _site/sdk-rust/index.html
          test -f _site/api-guide/index.html

  sdks:
    name: Verify npm and Rust SDKs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install npm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test npm SDK
        run: |
          pnpm --filter @rymelabs/rymedb build
          pnpm --filter @rymelabs/rymedb test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Test and package Rust SDK
        run: |
          cargo test --manifest-path sdks/rust/Cargo.toml --locked
          cargo package --manifest-path sdks/rust/Cargo.toml --locked --allow-dirty
