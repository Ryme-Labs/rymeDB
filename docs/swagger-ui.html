<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rymeDB REST API</title>
    <link rel="icon" type="image/png" href="../images/rymedb-transparent.png" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      html { box-sizing: border-box; background: #f7f9fc; }
      *, *::before, *::after { box-sizing: inherit; }
      body { margin: 0; background: #f7f9fc; }
      .swagger-ui .topbar { background: #172033; }
      .swagger-ui .topbar .link { max-width: none; }
      .swagger-ui .topbar-wrapper img { display: none; }
      .swagger-ui .topbar-wrapper::before {
        content: "rymeDB REST API";
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .swagger-ui .information-container,
      .swagger-ui .scheme-container,
      .swagger-ui .wrapper { max-width: 1280px; }
      .swagger-ui .information-container { padding-top: 1.5rem; }
      .swagger-ui .scheme-container { box-shadow: none; }
      .swagger-ui .opblock-tag { font-size: 1.25rem; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "../openapi/rest.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        persistAuthorization: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    </script>
  </body>
</html>
