name: sdk-release

on:
  push:
    branches: [main]
    paths:
      - "sdks/**"
      - "docs/sdk-release.md"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-tag-release.yml"
  pull_request:
    paths:
      - "sdks/**"
      - "docs/sdk-release.md"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-tag-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested SDKs to their registries
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        description: Publish the tested SDKs to their registries
        required: false
        type: boolean
        default: false

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Verify supported SDK set
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow only Java, npm, and Rust SDKs
        run: |
          actual="$(find sdks -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)"
          test "$actual" = "java,js,rust" || {
            echo "unexpected SDK directories: $actual"
            exit 1
          }

  npm:
    name: Build npm SDK
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm --filter @rymelabs/rymedb build
          pnpm --filter @rymelabs/rymedb test

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./sdks/js/package.json').version")"
          test "$actual" = "$expected" || {
            echo "npm SDK version $actual does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Pack npm artifact
        run: mkdir -p "$RUNNER_TEMP/npm" && npm pack --pack-destination "$RUNNER_TEMP/npm"
        working-directory: sdks/js

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  rust:
    name: Build Rust SDK
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --manifest-path sdks/rust/Cargo.toml --locked

      - name: Package crate
        run: cargo package --manifest-path sdks/rust/Cargo.toml --locked

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version = "\(.*\)"/\1/p' sdks/rust/Cargo.toml | head -n 1)"
          test "$actual" = "$expected" || {
            echo "Rust SDK version $actual does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Upload Cargo artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-cargo
          path: sdks/rust/target/package/*.crate
          if-no-files-found: error

  java:
    name: Build Java SDK
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Maven package
        run: mvn --batch-mode --update-snapshots -f sdks/java/pom.xml verify

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(mvn --batch-mode --quiet -f sdks/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          test "$actual" = "$expected" || {
            echo "Java SDK version $actual does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-maven
          path: |
            sdks/java/pom.xml
            sdks/java/target/*.jar
          if-no-files-found: error

  publish-npm:
    name: Publish npm SDK
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download tested npm package
        uses: actions/download-artifact@v4
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/npm

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP/npm/"*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public

  publish-cargo:
    name: Publish Rust SDK
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download tested Cargo package
        uses: actions/download-artifact@v4
        with:
          name: sdk-cargo
          path: ${{ runner.temp }}/cargo

      - name: Publish tested crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP/cargo/"*.crate)
          test "${#packages[@]}" -eq 1
          stage="$RUNNER_TEMP/cargo-publish"
          mkdir -p "$stage"
          tar -xzf "${packages[0]}" -C "$stage"
          manifest="$(find "$stage" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)"
          test -n "$manifest"
          cargo publish --manifest-path "$manifest" --locked --no-verify

  publish-java:
    name: Publish Java SDK
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven

      - name: Download tested Maven artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-maven
          path: ${{ runner.temp }}/maven

      - name: Publish tested Maven package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          jar="$(find "$RUNNER_TEMP/maven/target" -maxdepth 1 -type f -name 'rymedb-client-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          sources="$(find "$RUNNER_TEMP/maven/target" -maxdepth 1 -type f -name 'rymedb-client-*-sources.jar' -print -quit)"
          javadoc="$(find "$RUNNER_TEMP/maven/target" -maxdepth 1 -type f -name 'rymedb-client-*-javadoc.jar' -print -quit)"
          test -n "$jar" -a -n "$sources" -a -n "$javadoc"
          mvn --batch-mode org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile="$jar" \
            -DpomFile="$RUNNER_TEMP/maven/pom.xml" \
            -Dsources="$sources" \
            -Djavadoc="$javadoc" \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/Ryme-Labs/rymeDB

  release:
    name: Upload SDK release artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [npm, rust, java]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
