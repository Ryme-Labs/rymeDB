      responses:
        '200':
          description: drill report with backup id, verified file count, timestamp and optional error
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/shards:
    get:
      tags: [shards]
      description: "Layout varies by mode: single returns {mode, shards}; sharded adds a placement list with per-table shard and bytes; hybrid returns {mode, placement} with per-table tier."
      responses:
        '200':
          description: layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShardLayout'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/shards/move:
    post:
      tags: [shards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveShardRequest'
      responses:
        '200':
          description: move report with table, from, to, bytes and commit
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ranges:
    get:
      tags: [ranges]
      description: "List placement ranges, or look up the owning range with ?key=. Ranges carry leader and epoch; splits and merges bump epochs."
      parameters:
        - in: query
          name: key
          schema:
            type: string
          description: UTF-8 key text to route to its owning range
      responses:
        '200':
          description: range list, or a single range for ?key=
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/ranges/loads:
    get:
      tags: [ranges]
      description: "Per-range counted write load driving auto-split: id, epoch and writes since the range was created (splits and merges reset children to zero)."
      responses:
        '200':
          description: write load per range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RangeLoad'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/ranges/split:
    post:
      tags: [ranges]
      description: "Split a range at mid into left_id and right_id. Requires expected_epoch to match: stale callers get 409 with the current epoch so they can re-read placement and retry."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRangeRequest'
      responses:
        '200':
          description: the two child ranges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/ranges/merge:
    post:
      tags: [ranges]
      description: "Merge two adjacent same-leader ranges into merged_id. Both expected epochs must match; stale callers get 409."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRangesRequest'
      responses:
        '200':
          description: the merged range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/ranges/autosplit:
    post:
      tags: [ranges]
      description: "Split every range whose counted REST write load reaches min_writes (defaults to autosplit_writes). Splits use the key-space midpoint with epoch fencing; unsplittable or contended ranges are skipped. Returns the created child range ids."
      parameters:
        - in: query
          name: min_writes
          schema:
            type: integer
          description: write-load threshold override for this call
      responses:
        '200':
          description: created child range ids, empty when nothing was hot
          content:
            application/json:
              schema:
                type: object
                properties:
                  split:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/cluster/members:
    get:
      tags: [cluster]
      description: Raft term, local leadership, commit index, member list and any in-flight joint config.
      responses:
        '200':
          description: cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
        '400':
          description: node is not running in cluster mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [cluster]
      description: Admit a member with log catch-up followed by a joint-consensus transition. Send to the leader.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterMemberRequest'
      responses:
        '200':
          description: admitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/cluster/members/{id}:
    delete:
      tags: [cluster]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/cluster/transfer:
    post:
      tags: [cluster]
      description: Hand leadership to another member. Send to the leader.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterTransferRequest'
      responses:
        '200':
          description: transfer started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/cluster/replace:
    post:
      tags: [cluster]
      description: Swap the member set in one joint-consensus transition. Send to the leader.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterReplaceRequest'
      responses:
        '200':
          description: replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/stream:
    get:
      tags: [streams]
      parameters:
        - name: table
          in: query
          required: true
          schema:
            type: string
        - name: api_key
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: integer
          description: exclusive commit watermark; replays retained changes after it, then continues live without duplicates
      responses:
        '200':
          description: change stream
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/query-stream:
    get:
      tags: [streams]
      parameters:
        - name: table
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: api_key
          in: query
          schema:
            type: string
      responses:
        '200':
          description: live query stream
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    TableParam:
      name: table
      in: path
      required: true
      schema:
        type: string
    KeyParam:
      name: key
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: invalid argument
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: valid credentials without the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: unknown row, branch or checkpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: stale epoch or duplicate id; retry against current placement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: operation not available in this mode
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OkReceipt:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    CommitReceipt:
      type: object
      required: [commit]
      properties:
        commit:
          type: integer
    Ready:
      type: object
      properties:
        ready:
          type: boolean
        node:
          type: string
        commit:
          type: integer
        leader:
          type: boolean
        cluster:
          type: boolean
    SlowLog:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [kind, fingerprint, table, micros, at_unix]
            properties:
              kind:
                type: string
              fingerprint:
                type: string
              table:
                type: string
              micros:
                type: integer
              at_unix:
                type: integer
    TraceList:
      type: object
      required: [spans]
      properties:
        spans:
          type: array
          items:
            type: object
            required: [trace_id, span_id, name, started_unix, duration_micros, attributes]
            properties:
              trace_id:
                type: string
              span_id:
                type: string
              parent:
                type: string
              name:
                type: string
              started_unix:
                type: integer
              duration_micros:
                type: integer
              attributes:
                type: array
                items:
                  type: array
                  items:
                    type: string
    Metrics:
      type: object
      properties:
        node:
          type: string
        uptime_secs:
          type: integer
        commit:
          type: integer
        rest_count:
          type: integer
        rest_mean_micros:
          type: number
        rest_max_micros:
          type: integer
        p50_micros:
          type: integer
        p90_micros:
          type: integer
        p95_micros:
          type: integer
        p99_micros:
          type: integer
    CopyRequest:
      type: object
      required: [table, rows]
      properties:
        table:
          type: string
        rows:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key:
