site_name: rymeDB
site_description: A Rust-first realtime distributed database and backend platform.
site_url: https://ryme-labs.github.io/rymeDB/
repo_name: Ryme-Labs/rymeDB
repo_url: https://github.com/Ryme-Labs/rymeDB
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: images/rymedb-transparent.png
  favicon: images/rymedb-transparent.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Use light mode

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.tilde
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/mermaid.js

exclude_docs: |
  requirements-pages.txt

copyright: Copyright © Ryme Labs

nav:
  - Start here:
      - Overview: index.md
      - Configuration: configuration.md
      - Isolation and tenancy: isolation.md
  - Build and operate:
      - Production operations: production.md
      - Cluster operations: cluster-operations.md
      - Backup and restore: backup-restore.md
      - Streaming and realtime: streaming.md
      - RESP compatibility: resp.md
      - Migrations: migration.md
      - Performance: performance.md
  - API:
      - REST API reference: api.md
  - SDKs:
      - Java: sdk-java.md
      - npm / JavaScript: sdk-js.md
      - Rust: sdk-rust.md
  - Project:
      - SDK releases: sdk-release.md
