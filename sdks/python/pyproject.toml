[project]
name = "rymedb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "websocket-client>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
