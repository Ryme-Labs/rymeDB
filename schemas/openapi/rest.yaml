  /v1/backups/archives:
    get:
      tags: [backups]
      responses:
        '200':
          description: archive manifests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/backups/copy:
    post:
      tags: [backups]
