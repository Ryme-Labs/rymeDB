name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "schemas/openapi/validate.py"
      - "schemas/openapi/**"
      - "images/**"
      - "README.md"
      - "sdks/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "schemas/openapi/validate.py"
      - "schemas/openapi/**"
      - "images/**"
      - "README.md"
      - "sdks/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install page builder dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements-pages.txt

      - name: Validate OpenAPI spec
        run: python3 schemas/openapi/validate.py

      - name: Build static site
        run: python3 docs/build-pages.py --out _site

      - name: Verify generated site
        run: |
          test -f _site/index.html
          test -f _site/api/index.html
          test -f _site/openapi/rest.yaml
          test -f _site/openapi/rest.json
          test -f _site/sdks/java.html
          test -f _site/sdks/js.html
          test -f _site/sdks/rust.html
          test "$(find _site/sdks -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 3
          test "$(find _site/sdks -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
