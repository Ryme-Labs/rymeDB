<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rymeDB REST API</title>
    <link rel="icon" type="image/png" href="../images/rymedb-transparent.png" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.33.1/swagger-ui.css" />
    <style>
      html { box-sizing: border-box; background: #f7f9fc; }
      *, *::before, *::after { box-sizing: inherit; }
      body { margin: 0; background: #f7f9fc; }
      .swagger-ui .topbar { background: #172033; }
      .swagger-ui .topbar .link { max-width: none; }
      .swagger-ui .topbar-wrapper img { display: none; }
      .swagger-ui .topbar-wrapper::before {
        content: "rymeDB REST API";
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .swagger-ui .information-container,
      .swagger-ui .scheme-container,
      .swagger-ui .wrapper { max-width: 1280px; }
      .swagger-ui .information-container { padding-top: 1.5rem; }
      .swagger-ui .scheme-container {
        display: flex;
        justify-content: center;
        padding: 1.25rem 1rem;
        box-shadow: none;
      }
      .swagger-ui .scheme-container .schemes,
      .swagger-ui .scheme-container .servers {
        width: min(100%, 1280px);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
      }
      .swagger-ui .scheme-container .schemes > label,
      .swagger-ui .scheme-container .servers > label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
      }
      .swagger-ui .scheme-container .schemes select,
      .swagger-ui .scheme-container .servers select {
        min-width: 15rem;
        margin: 0;
      }
      .swagger-ui .auth-wrapper {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0;
      }
      .swagger-ui .auth-wrapper .authorize {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin: 0;
      }
      .swagger-ui .authorization__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        margin: 0;
      }
      .swagger-ui .auth-container {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.75rem;
      }
      .swagger-ui .auth-container .wrapper { max-width: none; }
      .swagger-ui .auth-btn-wrapper {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .swagger-ui .auth-btn-wrapper .btn {
        min-width: 7rem;
        margin: 0;
      }
      .swagger-ui .opblock-tag { font-size: 1.25rem; }
      @media screen and (max-width: 600px) {
        .swagger-ui .scheme-container .schemes,
        .swagger-ui .scheme-container .servers,
        .swagger-ui .scheme-container .schemes > label,
        .swagger-ui .scheme-container .servers > label {
          width: 100%;
        }
        .swagger-ui .scheme-container .schemes select,
        .swagger-ui .scheme-container .servers select {
          flex: 1;
          min-width: 0;
        }
        .swagger-ui .auth-container { grid-template-columns: 1fr; }
        .swagger-ui .auth-btn-wrapper { justify-content: stretch; }
        .swagger-ui .auth-btn-wrapper .btn { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "../openapi/rest.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        persistAuthorization: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    </script>
  </body>
</html>
