name: sdk-release

on:
  push:
    branches: [main]
    paths:
      - "sdks/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docs/sdk-release.md"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-tag-release.yml"
  pull_request:
    paths:
      - "sdks/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docs/sdk-release.md"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-tag-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested SDKs to their registries
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        description: Publish the tested SDKs to their registries
        required: false
        type: boolean
        default: false

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Verify supported SDK set
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow only npm and Rust SDKs
        run: |
          actual="$(find sdks -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)"
          test "$actual" = "js,rust" || {
            echo "unexpected SDK directories: $actual"
            exit 1
          }

  npm:
    name: Build npm SDK
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm --filter @rymelabs/rymedb build
          pnpm --filter @rymelabs/rymedb test

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./sdks/js/package.json').version")"
          test "$actual" = "$expected" || {
            echo "npm SDK version $actual does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Pack npm artifact
        run: mkdir -p "$RUNNER_TEMP/npm" && npm pack --pack-destination "$RUNNER_TEMP/npm"
        working-directory: sdks/js

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

      - name: Verify npm artifact contents
        run: |
          archive="$(find "$RUNNER_TEMP/npm" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -qx 'package/dist/index.js'
          tar -tzf "$archive" | grep -qx 'package/dist/index.d.ts'
          if tar -tzf "$archive" | grep -qE '(^|/)client\.test\.'; then
            echo "npm artifact unexpectedly contains test files"
            exit 1
          fi

  rust:
    name: Build Rust SDK
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --manifest-path sdks/rust/Cargo.toml --locked

      - name: Package crate
        run: cargo package --manifest-path sdks/rust/Cargo.toml --locked

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version = "\(.*\)"/\1/p' sdks/rust/Cargo.toml | head -n 1)"
          test "$actual" = "$expected" || {
            echo "Rust SDK version $actual does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Upload Cargo artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-cargo
          path: sdks/rust/target/package/*.crate
          if-no-files-found: error

  publish-npm:
    name: Publish npm SDK
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Download tested npm package
        uses: actions/download-artifact@v4
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/npm

      - name: Publish npm package
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP/npm/"*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance

  publish-cargo:
    name: Publish Rust SDK
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download tested Cargo package
        uses: actions/download-artifact@v4
        with:
          name: sdk-cargo
          path: ${{ runner.temp }}/cargo

      - name: Publish tested crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP/cargo/"*.crate)
          test "${#packages[@]}" -eq 1
          stage="$RUNNER_TEMP/cargo-publish"
          mkdir -p "$stage"
          tar -xzf "${packages[0]}" -C "$stage"
          manifest="$(find "$stage" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)"
          test -n "$manifest"
          cargo publish --manifest-path "$manifest" --locked --no-verify

  release:
    name: Upload SDK release artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [npm, rust]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t artifacts < <(
            find release -type f \( -name '*.tgz' -o -name '*.crate' \) -print
          )
          test "${#artifacts[@]}" -gt 0
          (cd release && find . -type f \( -name '*.tgz' -o -name '*.crate' \) -print0 | sort -z | xargs -0 sha256sum) > release/SHA256SUMS
          artifacts+=(release/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" --verify-tag --generate-notes
