name: sdk-release

on:
  push:
    branches: [main]
    paths:
      - "sdks/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "sdks/RELEASE_BASE_VERSION"
      - "docs/sdk-release.md"
      - ".github/workflows/sdk-release.yml"
  pull_request:
    paths:
      - "sdks/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "sdks/RELEASE_BASE_VERSION"
      - "docs/sdk-release.md"
      - ".github/workflows/sdk-release.yml"
  workflow_dispatch:

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Verify supported SDK set
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow only npm and Rust SDKs
        run: |
          actual="$(find sdks -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)"
          test "$actual" = "js,rust" || {
            echo "unexpected SDK directories: $actual"
            exit 1
          }

  npm:
    name: Build npm SDK
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm --filter @rymelabs/rymedb build
          pnpm --filter @rymelabs/rymedb test

      - name: Pack npm artifact
        run: mkdir -p "$RUNNER_TEMP/npm" && npm pack --pack-destination "$RUNNER_TEMP/npm"
        working-directory: sdks/js

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

      - name: Verify npm artifact contents
        run: |
          archive="$(find "$RUNNER_TEMP/npm" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -qx 'package/dist/index.js'
          tar -tzf "$archive" | grep -qx 'package/dist/index.d.ts'
          if tar -tzf "$archive" | grep -qE '(^|/)client\.test\.'; then
            echo "npm artifact unexpectedly contains test files"
            exit 1
          fi

  rust:
    name: Build Rust SDK
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --manifest-path sdks/rust/Cargo.toml --locked

      - name: Package crate
        run: cargo package --manifest-path sdks/rust/Cargo.toml --locked

      - name: Upload Cargo artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-cargo
          path: sdks/rust/target/package/*.crate
          if-no-files-found: error

  release-version:
    name: Choose next automatic SDK version
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calculate next major version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0] // empty')"
          if [[ -n "$previous_release" ]]; then
            current="${previous_release#v}"
          else
            current="$(tr -d '\r\n' < sdks/RELEASE_BASE_VERSION)"
          fi
          major="${current%%.*}"
          [[ "$major" =~ ^[0-9]+$ ]]
          candidate_major=$((major + 1))
          while :; do
            version="${candidate_major}.0.0"
            npm_response="$RUNNER_TEMP/npm-$version.json"
            if ! npm_status="$(curl --retry 3 --retry-all-errors -sS \
              -H 'Accept: application/json' \
              --output "$npm_response" --write-out '%{http_code}' \
              "https://registry.npmjs.org/@rymelabs%2frymedb/$version")"; then
              echo "npm version lookup failed for @rymelabs/rymedb@$version"
              exit 1
            fi
            case "$npm_status" in
              200)
                npm_version="$(jq -er '.version // empty' "$npm_response")" || {
                  echo "npm returned an invalid response while checking @rymelabs/rymedb@$version"
                  exit 1
                }
                [[ "$npm_version" == "$version" ]] || {
                  echo "npm returned an unexpected version while checking @rymelabs/rymedb@$version"
                  exit 1
                }
                ;;
              404)
                npm_version=""
                ;;
              *)
                echo "npm registry returned HTTP $npm_status while checking @rymelabs/rymedb@$version"
                exit 1
                ;;
            esac

            crate_response="$RUNNER_TEMP/crates-io-$version.json"
            if ! crate_status="$(curl --retry 3 --retry-all-errors -sS \
              -H 'User-Agent: rymeDB (https://github.com/Ryme-Labs/rymeDB)' \
              --output "$crate_response" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/rymedb-client/$version")"; then
              echo "Crates.io version lookup failed for rymedb-client@$version"
              exit 1
            fi
            case "$crate_status" in
              200)
                crate_version="$(jq -er '.version.num // empty' "$crate_response")" || {
                  echo "Crates.io returned an invalid response while checking rymedb-client@$version"
                  exit 1
                }
                ;;
              404)
                crate_version=""
                ;;
              *)
                echo "Crates.io returned HTTP $crate_status while checking rymedb-client@$version"
                exit 1
                ;;
            esac
            if [[ -z "$npm_version" && -z "$crate_version" ]]; then
              break
            fi
            echo "SDK version $version is already present (npm=$npm_version crates.io=$crate_version); trying the next major"
            candidate_major=$((candidate_major + 1))
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SDK release version: $version (after $current)"

  publish-npm:
    name: Publish npm SDK
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [npm, release-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set automatic release version
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: node scripts/set-sdk-version.mjs "$RELEASE_VERSION"

      - name: Install dependencies and test release package
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @rymelabs/rymedb build
          pnpm --filter @rymelabs/rymedb test

      - name: Pack npm artifact
        run: mkdir -p "$RUNNER_TEMP/npm" && npm pack --pack-destination "$RUNNER_TEMP/npm"
        working-directory: sdks/js

      - name: Upload npm release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-npm-release
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

      - name: Publish npm package
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP/npm/"*.tgz)
          test "${#packages[@]}" -eq 1
          expected="sha512-$(openssl dgst -sha512 -binary "${packages[0]}" | openssl base64 -A)"
          if npm_response="$(npm view "@rymelabs/rymedb@$RELEASE_VERSION" dist.integrity --json 2>/dev/null)"; then
            published="$(jq -er 'if type == "string" then . else empty end' <<< "$npm_response")" || {
              echo "npm returned an invalid response while checking @rymelabs/rymedb@$RELEASE_VERSION"
              exit 1
            }
          elif jq -e '.error.code == "E404"' <<< "$npm_response" >/dev/null 2>&1; then
            published=""
          else
            echo "npm package lookup failed for @rymelabs/rymedb@$RELEASE_VERSION"
            exit 1
          fi
          if [[ -n "$published" && "$published" != "undefined" && "$published" != "null" ]]; then
            if [[ "$published" != "$expected" ]]; then
              echo "@rymelabs/rymedb@$RELEASE_VERSION already exists with different contents"
              exit 1
            fi
            echo "@rymelabs/rymedb@$RELEASE_VERSION already published with matching integrity; skipping"
          else
            npm publish "${packages[0]}" --access public --provenance
          fi

  publish-cargo:
    name: Publish Rust SDK
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [rust, release-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set automatic release version
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: node scripts/set-sdk-version.mjs "$RELEASE_VERSION"

      - name: Test and package release crate
        run: |
          cargo test --manifest-path sdks/rust/Cargo.toml --locked
          cargo package --manifest-path sdks/rust/Cargo.toml --locked --allow-dirty

      - name: Upload Cargo release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-cargo-release
          path: sdks/rust/target/package/*.crate
          if-no-files-found: error

      - name: Publish crate if not already published
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          shopt -s nullglob
          packages=("sdks/rust/target/package/"*.crate)
          test "${#packages[@]}" -eq 1
          expected="$(sha256sum "${packages[0]}" | cut -d ' ' -f1)"
          metadata_file="$RUNNER_TEMP/crates-io-publish-$RELEASE_VERSION.json"
          if ! crate_status="$(curl --retry 3 --retry-all-errors -sS \
            -H 'User-Agent: rymeDB (https://github.com/Ryme-Labs/rymeDB)' \
            --output "$metadata_file" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/rymedb-client/$RELEASE_VERSION")"; then
            echo "Crates.io lookup failed for rymedb-client@$RELEASE_VERSION"
            exit 1
          fi
          case "$crate_status" in
            200)
              published="$(jq -er '.version.checksum // empty' "$metadata_file")" || {
                echo "Crates.io returned an invalid response while checking rymedb-client@$RELEASE_VERSION"
                exit 1
              }
              ;;
            404)
              published=""
              ;;
            *)
              echo "Crates.io returned HTTP $crate_status while checking rymedb-client@$RELEASE_VERSION"
              exit 1
              ;;
          esac
          if [[ -n "$published" ]]; then
            if [[ "$published" != "$expected" ]]; then
              echo "rymedb-client@$RELEASE_VERSION already exists with different contents"
              exit 1
            fi
            echo "rymedb-client@$RELEASE_VERSION already published with matching checksum; skipping"
          else
            cargo publish --manifest-path sdks/rust/Cargo.toml --locked --no-verify --allow-dirty
          fi

  release:
    name: Commit version and create SDK release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [publish-npm, publish-cargo, release-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*-release
          path: release
          merge-multiple: true

      - name: Commit automatic version and publish release tag
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/set-sdk-version.mjs "$RELEASE_VERSION"
          git config user.name deyoyk
          git config user.email deyoyk@users.noreply.github.com
          git add sdks/js/package.json sdks/rust/Cargo.toml sdks/rust/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Release SDKs v$RELEASE_VERSION"
            git push origin HEAD:main
          fi
          tag="v$RELEASE_VERSION"
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{}")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$tag" -m "SDK release $tag"
            git push origin "$tag"
          fi
          (cd release && find . -type f \( -name '*.tgz' -o -name '*.crate' \) -print0 | sort -z | xargs -0 sha256sum) > release/SHA256SUMS
          mapfile -t artifacts < <(find release -type f \( -name '*.tgz' -o -name '*.crate' -o -name 'SHA256SUMS' \) -print | sort)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" --verify-tag --title "SDK release $tag" \
              --notes "SDK release run: $GITHUB_RUN_ID"
          fi
