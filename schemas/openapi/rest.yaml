openapi: 3.0.3
info:
  title: rymeDB REST API
  version: 0.1.0
  description: Operator and data-plane HTTP API for a rymeDB node.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
  - apiKeyHeader: []
tags:
  - name: node
  - name: kv
  - name: sql
  - name: rest
  - name: auth
  - name: migrate
  - name: index
  - name: branches
  - name: backups
  - name: shards
  - name: cluster
  - name: streams
paths:
  /health:
    get:
      tags: [node]
      security: []
      responses:
        '200':
          description: ok
  /dashboard:
    get:
      tags: [node]
      security: []
      description: Static admin web UI (no auth on the shell itself; every API call carries the key).
      responses:
        '200':
          description: html admin console
  /ready:
    get:
      tags: [node]
      security: []
      responses:
        '200':
          description: readiness plus leadership view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
  /metrics:
    get:
      tags: [node]
      security: []
      responses:
        '200':
          description: latency histogram snapshot plus node counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /metrics/prometheus:
    get:
      tags: [node]
      security: []
      responses:
        '200':
          description: prometheus text exposition
  /v1/observe/slow:
    get:
      tags: [node]
      description: "Recent slow operations (over 5ms) newest-first with kind, fingerprint, table, micros and unix timestamp. Only fingerprints are stored, never raw statements."
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: max entries, default 100
        - in: query
          name: table
          schema:
            type: string
          description: only entries for this table
      responses:
        '200':
          description: slow entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlowLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/traces:
    get:
      tags: [node]
      description: "Recent request spans newest-first with trace/span ids, name, timing and attributes. Backed by the in-memory trace collector fed by the kv/sql/copy handlers."
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: max spans, default 100
        - in: query
          name: name
          schema:
            type: string
          description: only spans with this operation name
        - in: query
          name: table
          schema:
            type: string
          description: only spans carrying this table attribute
      responses:
        '200':
          description: trace spans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/metering:
    get:
      tags: [node]
      responses:
        '200':
          description: idempotent usage aggregates
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/summary:
    get:
      tags: [node]
      description: Per-tenant usage rollup for downstream invoicing. Aggregation is idempotent; billing outages never block the data path.
      responses:
        '200':
          description: tenant bills
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/invoice:
    get:
      tags: [node]
      description: Priced invoice for one tenant in micro-USD. Non-owners may only invoice their own tenant. Feed lines to Stripe; rymeDB never calls Stripe from the data path.
      parameters:
        - name: tenant
          in: query
          schema:
            type: string
      responses:
        '200':
          description: invoice with line items and micro-USD total
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/autoscale:
    get:
      tags: [node]
      security: []
      responses:
        '200':
          description: autoscale pressure advice
  /v1/qos:
    get:
      tags: [node]
      responses:
        '200':
          description: per-tenant QoS tiers and usage
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/qos/tier:
    post:
      tags: [node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QosTierRequest'
      responses:
        '200':
          description: tier updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/migrate/supabase:
    post:
      tags: [migrate]
      description: Analyze a Supabase Postgres dump into tables and RLS policies with detected tenant columns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupabaseAnalyzeRequest'
      responses:
        '200':
          description: extracted schema plan
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/migrate/neon:
    post:
      tags: [migrate]
      description: Map a Neon branch list (name/parent/LSN) into rymeDB branch create plans.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeonAnalyzeRequest'
      responses:
        '200':
          description: branch plans with base commit timestamps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/migrate/apply:
    post:
      tags: [migrate]
      description: "Execute one write SQL statement and record it in the hash-chained migration ledger. Read-only statements get 400; duplicate ids get 409 before anything runs twice."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateApplyRequest'
      responses:
        '201':
          description: recorded ledger entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/migrate/ledger:
    get:
      tags: [migrate]
      description: "Migration ledger entries in apply order with the schema version and chain validity."
      responses:
        '200':
          description: ledger state
          content:
            application/json:
              schema:
                type: object
                required: [entries, version, valid]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  version:
                    type: integer
                  valid:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/register:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: user registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: id already registered; re-registration never overwrites
          content:
            application/json:
              schema:
                type: object
  /v1/auth/verify:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
      responses:
        '200':
          description: password verification receipt
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/token:
    post:
      tags: [auth]
      security: []
      description: "Verify id/password (plus TOTP code when the account enrolled one) and issue a usable API key. The key carries the account tenant and roles."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '201':
          description: issued key and tenant
          content:
            application/json:
              schema:
                type: object
                required: [key, tenant]
                properties:
                  key:
                    type: string
                  tenant:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/keys:
    delete:
      tags: [auth]
      description: "Revoke an API key by value. Requires a write-capable principal; the body carries the key so it never appears in access logs."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
      responses:
        '200':
          description: revocation receipt
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/otp/setup:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSetupRequest'
      responses:
        '200':
          description: TOTP secret
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verification receipt
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/challenge:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyChallengeRequest'
      responses:
        '200':
          description: WebAuthn challenge
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/register:
    post:
      tags: [auth]
      description: "Enroll a P-256 credential for a user. Requires a write-capable principal; the public key must be a valid SEC1 point. No attestation verification in v1 (self-enrollment by an authenticated admin)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterRequest'
      responses:
        '201':
          description: enrollment receipt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/passkey/verify:
    post:
      tags: [auth]
      security: []
      description: "Verify a WebAuthn assertion (rpId hash, user-presence flag, origin allow-list, challenge freshness with one-shot consumption, sign-count monotonicity, ECDSA over authenticatorData and clientData hash) and issue a usable API key."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyVerifyRequest'
      responses:
        '201':
          description: issued key and tenant
          content:
            application/json:
              schema:
                type: object
                required: [key, tenant]
                properties:
                  key:
                    type: string
                  tenant:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/oidc/login:
    post:
      tags: [auth]
      security: []
      description: Build a provider authorization URL. OIDC token verification accepts HS256 secrets or RS256 keys loaded from a configured JWKS file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcLoginRequest'
      responses:
        '200':
          description: authorization URL and state
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/oidc/token:
    post:
      tags: [auth]
      security: []
      description: Verify a provider ID token and issue a usable API key carrying the identity tenant and roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcTokenRequest'
      responses:
        '201':
          description: issued key and tenant
          content:
            application/json:
              schema:
                type: object
                required: [key, tenant]
                properties:
                  key:
                    type: string
                  tenant:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/mask:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaskRequest'
      responses:
        '200':
          description: column mask updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/presence/join:
    post:
      tags: [streams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceJoinRequest'
      responses:
        '200':
          description: member count
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/presence/leave:
    post:
      tags: [streams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceLeaveRequest'
      responses:
        '200':
          description: removal receipt
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/presence/{channel}:
    get:
      tags: [streams]
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: live members
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/broadcast:
    post:
      tags: [streams]
      description: "Publish an ephemeral tenant-scoped broadcast. In cluster mode the current leader fans it over the cluster mesh; broadcasts are not replayed after restart."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '200':
          description: broadcast sequence
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/broadcast/{channel}:
    get:
      tags: [streams]
      description: "Live broadcast subscription for one channel, tenant-scoped like posts. Frames are BroadcastMsg JSON (channel, from, payload, commit_ts, sequence)."
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
        - name: api_key
          in: query
          schema:
            type: string
      responses:
        '200':
          description: broadcast stream
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/topics/append:
    post:
      tags: [streams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DurableAppendRequest'
      responses:
        '200':
          description: durable cursor
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/regions:
    get:
      tags: [node]
      security: []
      description: Region placement and follower status. Followers run read_only and reject mutations with 503; strong cross-region writes are WAN-RTT bound by physics.
      responses:
        '200':
          description: region view
          content:
            application/json:
              schema:
                type: object
  /v1/topics/read:
    get:
      tags: [streams]
      parameters:
        - name: partition
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: messages from cursor
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/topics/{partition}/stream:
    get:
      tags: [streams]
      description: "Live durable topic WebSocket. Replays retained messages from the optional cursor, then follows committed appends; a cursor gap outside retention closes the stream."
      parameters:
        - name: partition
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: integer
        - name: api_key
          in: query
          schema:
            type: string
      responses:
        '101':
          description: durable topic WebSocket upgrade
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/vector/upsert:
    post:
      tags: [index]
      description: Upsert a dense vector. Exact brute-force cosine search; v1 limits documented in schemas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorUpsertRequest'
      responses:
        '200':
          description: stored
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/vector/search:
    post:
      tags: [index]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchRequest'
      responses:
        '200':
          description: nearest hits by cosine score
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/vector/ann-search:
    post:
      tags: [index]
      description: Approximate HNSW search. Higher ef trades latency for recall; ef >= 64 recommended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnSearchRequest'
      responses:
        '200':
          description: approximate nearest hits by cosine score
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/vector/{table}/{id}:
    delete:
      tags: [index]
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: removal receipt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/text/index:
    post:
      tags: [index]
      description: Index a document for TF-IDF ranked full-text search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextIndexRequest'
      responses:
        '200':
          description: indexed term count
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/text/search:
    post:
      tags: [index]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextSearchRequest'
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/text/{table}/{id}:
    delete:
      tags: [index]
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: removal receipt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/index/stats:
    get:
      tags: [index]
      description: Index partition count and namespaces. Writes hash-route by id; reads fan out and merge.
      responses:
        '200':
          description: partition layout
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/kv/{table}/{key}:
    get:
      tags: [kv]
      description: Fetch a raw value. The response body is the stored bytes.
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - $ref: '#/components/parameters/KeyParam'
      responses:
        '200':
          description: value bytes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [kv]
      description: Store a raw value. The request body is the value bytes.
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - $ref: '#/components/parameters/KeyParam'
        - name: ttl
          in: query
          description: expiry in seconds
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: commit receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [kv]
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - $ref: '#/components/parameters/KeyParam'
      responses:
        '200':
          description: commit receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/kv/{table}/{key}/ttl:
    get:
      tags: [kv]
      description: Remaining TTL in seconds, or -1 when the key never expires.
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - $ref: '#/components/parameters/KeyParam'
      responses:
        '200':
          description: ttl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KvTtl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sql:
    post:
      tags: [sql]
      description: Execute one statement in the KEY/VALUE dialect, for example INSERT INTO docs KEY 'k' VALUE 'v' or SELECT * FROM docs KEY 'k'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
      responses:
        '200':
          description: ok, single row, or row set depending on the statement
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SqlOk'
                  - $ref: '#/components/schemas/SqlRow'
                  - $ref: '#/components/schemas/SqlRows'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sql/copy:
    post:
      tags: [sql]
      description: Bulk ingest up to 10000 rows in 500-row transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '200':
          description: ingest receipt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sql/explain:
    post:
      tags: [sql]
      description: Return the planned access path without executing writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
      responses:
        '200':
          description: plan
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rest/v1/{table}:
    get:
      tags: [rest]
      description: Supabase-style list with select, key=eq.<id>, order, limit, offset.
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - name: select
          in: query
          description: comma-separated fields to project; aliases use alias:field
          schema:
            type: string
        - name: key
          in: query
          description: PostgREST filter, for example eq.k1
          schema:
            type: string
        - name: order
          in: query
          description: field.asc or field.desc (key is the default field)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: rows as JSON objects
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [rest]
      description: Insert one row or a rows array.
      parameters:
        - $ref: '#/components/parameters/TableParam'
      responses:
        '201':
          description: created rows
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [rest]
      description: Upsert key/value rows or partially update JSON object rows selected by PostgREST filters.
      parameters:
        - $ref: '#/components/parameters/TableParam'
      responses:
        '201':
          description: upserted rows
        '200':
          description: updated rows
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [rest]
      description: Delete with key=eq.<id> required.
      parameters:
        - $ref: '#/components/parameters/TableParam'
      responses:
        '200':
          description: commit receipt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /graphql:
    post:
      tags: [rest]
      description: Minimal GraphQL with table(key:) or table(limit:) selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphqlRequest'
      responses:
        '200':
          description: data envelope
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/scan/{table}:
    get:
      tags: [sql]
      parameters:
        - $ref: '#/components/parameters/TableParam'
        - name: limit
