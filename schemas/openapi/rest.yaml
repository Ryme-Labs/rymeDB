          description: max rows, default 100, capped at 1000
          schema:
            type: integer
      responses:
        '200':
          description: rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlRows'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/branches:
