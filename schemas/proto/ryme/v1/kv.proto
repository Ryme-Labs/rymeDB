syntax = "proto3";

package rymedb.v1;

service Ryme {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc KvGet(KvGetRequest) returns (KvGetReply);
  rpc KvPut(KvPutRequest) returns (CommitReply);
  rpc KvDelete(KvDeleteRequest) returns (CommitReply);
  rpc Scan(ScanRequest) returns (ScanReply);
  rpc Sql(SqlRequest) returns (SqlReply);
}

message HealthRequest {}

message HealthReply {
  bool ok = 1;
  string version = 2;
}

message KvGetRequest {
  string table = 1;
  bytes pk = 2;
}

message KvGetReply {
  bool ok = 1;
  string error = 2;
  bytes value = 3;
  bool found = 4;
}

message KvPutRequest {
  string table = 1;
  bytes pk = 2;
  bytes value = 3;
  uint64 ttl_secs = 4;
}

message KvDeleteRequest {
  string table = 1;
  bytes pk = 2;
}

message CommitReply {
  bool ok = 1;
  string error = 2;
  uint64 commit = 3;
}

message ScanRequest {
  string table = 1;
  uint32 limit = 2;
}

message Row {
  bytes pk = 1;
  bytes value = 2;
}

message ScanReply {
  bool ok = 1;
  string error = 2;
  repeated Row rows = 3;
}

message SqlRequest {
  string sql = 1;
}

message SqlReply {
  bool ok = 1;
  string error = 2;
  repeated Row rows = 3;
}
