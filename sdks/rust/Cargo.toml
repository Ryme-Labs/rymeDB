[package]
name = "rymedb-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Async Rust client for the rymeDB HTTP API"
repository = "https://github.com/Ryme-Labs/rymeDB"
readme = "README.md"

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
futures-util = { version = "0.3", features = ["sink"] }
percent-encoding = "2"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
